<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Port Authority icon: a USB-C socket inside an open ring drawn in the
       app's speed ramp. The ring is the "is it right" signal the UI draws
       around a link; the socket is the thing being judged. No tile, no
       outline: the ground is transparent, and the socket's black interior
       keeps the white outline legible on a light background. -->
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="226" y2="226">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#eb47a9"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="104" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" stroke-dasharray="520 134" transform="rotate(-60 128 128)"/>
  <rect x="74" y="102" width="108" height="52" rx="26" fill="#111111" stroke="#f4f4f5" stroke-width="16"/>
</svg>
