# Runs on every push and pull request to main: Go build, vet and tests on
# Windows (the release target) and Linux (catches a platform/ import
# creeping into core/), plus the frontend's type check and unit tests.
#
# Two generated trees are gitignored and must exist before Go compiles:
#   frontend/wailsjs/  TypeScript bindings for the App struct, from
#                      `wails generate module`, imported by App.svelte.
#   frontend/dist/     the Vite bundle main.go embeds. A .gitkeep keeps
#                      go:embed valid, so `go build` works before the
#                      bundle exists; the frontend job builds the real one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  frontend:
    name: Frontend check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate Wails bindings
        run: wails generate module
      - name: Type check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:run
      - name: Build bundle
        working-directory: frontend
        run: npm run build
